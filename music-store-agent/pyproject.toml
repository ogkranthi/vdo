[project]
name = "music-store-agent"
version = "0.1.0"
description = "Melody Records customer support agent — LangChain Deep Agents + LangSmith demo on the Chinook dataset"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
    "deepagents>=0.2",
    "langgraph>=1.0",
    "langsmith>=0.4",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4",
    "pytest>=8.0",
    "openevals>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
